<script>
/* ── 自动选路 ────────────────────────────────────────────────────────────
   在家：内网 https（毫秒级）；在外：隧道。判据是 fetch 一个 204 探测点。
   手机没装根证书时 fetch 会因证书不受信而失败 ⇒ 自动走隧道，**不会白屏**。
   这一点是刻意的：加速可以失效，能用不能失效。                        */
(function(){
  var LAN  = ["https://192.168.2.20:8790", "https://jackieMacBook-Pro.local:8790"];          /* 内网候选，按"快→稳"排列 */
  var TUN  = "https://copyright-spokesman-tariff-corners.trycloudflare.com";
  var h1   = document.getElementById('h1');
  var err  = document.getElementById('err');
  var done = false;

  function go(url){
    if (done) return;
    done = true;
    /* 必须摘掉 meta refresh：否则它到点还会再跳一次，把已经选好的路覆盖掉 */
    try{
      var m = document.querySelector('meta[http-equiv="refresh"]');
      if (m && m.parentNode) m.parentNode.removeChild(m);
    }catch(e){}
    location.replace(url);
  }

  function probe(base){
    return new Promise(function(res){
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var fin = false;
      var timer = setTimeout(function(){
        if (fin) return; fin = true;
        try{ ctl && ctl.abort(); }catch(e){}
        res(false);
      }, 900);
      var opt = { mode:'cors', cache:'no-store', credentials:'omit' };
      if (ctl) opt.signal = ctl.signal;
      fetch(base + '/__tm_ping', opt).then(function(r){
        if (fin) return; fin = true;
        clearTimeout(timer);
        res(!!r && (r.ok || r.status === 204));
      }).catch(function(){
        if (fin) return; fin = true;
        clearTimeout(timer);
        res(false);
      });
    });
  }

  if (!LAN.length){ setTimeout(function(){ go(TUN); }, 120); return; }

  var left = LAN.length;
  LAN.forEach(function(b){
    probe(b).then(function(ok){
      if (ok){ go(b + '/'); return; }
      if (--left === 0 && !done) go(TUN);
    });
  });

  /* 兜底：探测卡住（DNS 慢、系统刚醒）也不能让人干等 */
  setTimeout(function(){ if (!done) go(TUN); }, 1800);

  /* 隧道也不通时留在本页给出原因（只有真的连不上才出现） */
  setTimeout(function(){
    if (!done) return;
    fetch(TUN, { mode:'no-cors', cache:'no-store' }).catch(function(){
      var m = document.querySelector('meta[http-equiv="refresh"]');
      if (m && m.parentNode) m.parentNode.removeChild(m);
      h1.textContent = '反T监控台 · 入口';
      err.style.display = 'block';
    });
  }, 0);
})();
